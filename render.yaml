services:
  - type: web
    name: policy-rag-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.app:app --bind 0.0.0.0:$PORT --timeout 300 --graceful-timeout 30 --workers 1 --threads 2 --preload
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: OPENROUTER_API_KEY
        fromSecret: OPENROUTER_API_KEY
    plan: free
